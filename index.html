<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RM 操控台</title>
<style>
  :root{
    --bg:#0d0f12; --panel:#171a1f; --panel2:#1f232a; --line:#2c323b;
    --txt:#e8eaed; --dim:#8b93a1; --on:#1f8a4c; --warn:#b23b3b; --accent:#2f6fd0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    user-select:none;-webkit-user-select:none;overscroll-behavior:none;
    display:flex;flex-direction:column;
  }
  /* ---------- 顶栏 ---------- */
  header{
    display:flex;align-items:center;gap:10px;padding:8px 12px;
    border-bottom:1px solid var(--line);background:var(--panel);
  }
  header button{flex:0 0 auto;}
  #status{font-size:13px;color:var(--dim);}
  #status.ok{color:#4ec87a;}
  #status.err{color:#e06c6c;}
  #lastmsg{margin-left:auto;font-size:12px;color:var(--dim);
    max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-family:ui-monospace,Consolas,monospace;}
  /* ---------- 主体 ---------- */
  main{flex:1;display:flex;gap:10px;padding:10px;min-height:0;}
  section{background:var(--panel);border:1px solid var(--line);border-radius:12px;}
  /* 左：行驶 */
  #drive{flex:0 0 44%;display:flex;flex-direction:column;gap:8px;padding:10px;}
  #drive .title{font-size:12px;color:var(--dim);letter-spacing:1px;}
  #pad{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;}
  #pad button{font-size:26px;}
  #rot{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  #rot button{height:52px;font-size:15px;}
  /* 右：工具 */
  #tools{flex:1;display:flex;flex-direction:column;gap:8px;padding:10px;overflow:auto;}
  .group{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--panel2);}
  .group h3{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--dim);letter-spacing:1px;}
  .row{display:grid;gap:6px;margin-bottom:6px;}
  .row:last-child{margin-bottom:0;}
  .r2{grid-template-columns:1fr 1fr;}
  .r4{grid-template-columns:repeat(4,1fr);}
  /* ---------- 按钮 ---------- */
  button{
    background:#242a33;color:var(--txt);border:1px solid var(--line);
    border-radius:9px;padding:0 10px;min-height:46px;font-size:15px;
    touch-action:none;transition:background .06s;
  }
  button:active{background:#31394a;}
  button.on{background:var(--on);border-color:var(--on);}
  button.danger{background:#3a2222;border-color:#5a2f2f;}
  button.danger.on{background:var(--warn);border-color:var(--warn);}
  button:disabled{opacity:.35;}
  /* 档位按钮小一点 */
  .r4 button{font-size:13px;min-height:42px;padding:0 4px;}
  /* 速度滑条 */
  .spd{display:flex;flex-direction:column;gap:6px;}
  .spd label{font-size:12px;color:var(--dim);}
  input[type=range]{width:100%;height:28px;}
  /* ---------- 日志 ---------- */
  #log{height:0;overflow:hidden;margin:0 10px;background:#07090b;border:0;border-radius:8px;
       font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#7fbf8f;white-space:pre-wrap;}
  #log.show{height:76px;overflow:auto;border:1px solid var(--line);margin-bottom:10px;padding:6px;}
  /* ---------- 竖屏提示 ---------- */
  #rotate{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99;
          align-items:center;justify-content:center;text-align:center;font-size:18px;line-height:1.8;}
  @media (orientation:portrait){ #rotate{display:flex;} }
  @media (max-height:420px){ #log.show{height:52px;} }
</style>
</head>
<body>

<header>
  <button id="btnConnect">连接蓝牙</button>
  <span id="status">未连接</span>
  <span id="lastmsg"></span>
  <button id="btnLog" style="margin-left:6px;min-height:34px;font-size:12px;">日志</button>
</header>

<main>
  <!-- ================= 左：行驶 ================= -->
  <section id="drive">
    <div class="title">行驶 · 全向麦轮</div>
    <div id="pad">
      <button class="mv" data-vx="0.707"  data-vy="0.707">↖</button>
      <button class="mv" data-vx="1"      data-vy="0">↑</button>
      <button class="mv" data-vx="0.707"  data-vy="-0.707">↗</button>

      <button class="mv" data-vx="0"      data-vy="1">←</button>
      <button id="btnStop" class="danger">停</button>
      <button class="mv" data-vx="0"      data-vy="-1">→</button>

      <button class="mv" data-vx="-0.707" data-vy="0.707">↙</button>
      <button class="mv" data-vx="-1"     data-vy="0">↓</button>
      <button class="mv" data-vx="-0.707" data-vy="-0.707">↘</button>
    </div>
    <div id="rot">
      <button class="mv" data-vx="0" data-vy="0" data-w="1">↺ 左转</button>
      <button class="mv" data-vx="0" data-vy="0" data-w="-1">↻ 右转</button>
    </div>
  </section>

  <!-- ================= 右：机构 ================= -->
  <section id="tools">

    <div class="group">
      <h3>铲斗升降</h3>
      <div class="row r2">
        <button class="hold" data-cmd="LIFT:UP">▲ 上升</button>
        <button class="hold" data-cmd="LIFT:DOWN">▼ 下降</button>
      </div>
      <div class="row r4">
        <button data-tap="LIFT:GO:10">最低</button>
        <button data-tap="LIFT:GO:168">取B矿</button>
        <button data-tap="LIFT:GO:415">高位</button>
        <button data-tap="LIFT:GO:120">卸矿</button>
      </div>
    </div>

    <div class="group">
      <h3>铲斗翻转</h3>
      <div class="row r2">
        <button data-tap="FLIP:0">收回 0°</button>
        <button data-tap="FLIP:1">翻转 110°</button>
      </div>
    </div>

    <div class="group">
      <h3>摄像头 / 视觉</h3>
      <div class="row r2">
        <button class="tog" data-tog="CAM" data-label="摄像头">摄像头 关</button>
        <button class="tog" data-tog="VISION" data-label="视觉">视觉 关</button>
      </div>
    </div>

    <div class="group">
      <h3>安全</h3>
      <div class="row r2">
        <button id="btnArm" class="tog" data-label="解锁">解锁</button>
        <button id="btnStopAll" class="danger">全部停止</button>
      </div>
    </div>

    <div class="group spd">
      <label>行驶速度 <b id="spdv">300</b> mm/s（上限 450）</label>
      <input type="range" id="spd" min="100" max="450" step="25" value="300">
    </div>

  </section>
</main>

<div id="log"></div>

<div id="rotate">📱 请把手机横过来<br><span style="font-size:14px;color:#888">操控台是横屏布局</span></div>

<script>
/* ============================================================
 * 蓝牙 UART 定义（和 ESP32 固件一致，Nordic UART Service）
 * ============================================================ */
const SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const RX_CH   = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
const TX_CH   = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

let rxChar = null, txChar = null, devRef = null;
let armed = false, camOn = false, visionOn = false;
let moveTimer = null, moveVec = null;      // 行驶长按
let holdTimer = null, holdCmd = null;      // 升降长按

const $ = id => document.getElementById(id);
const enc = new TextEncoder();

/* ---------------- 日志 ---------------- */
function log(s){
  const el = $('log');
  el.textContent += s + '\n';
  if (el.textContent.length > 2000) el.textContent = el.textContent.slice(-1500);
  el.scrollTop = el.scrollHeight;
}
function setStatus(s, cls){ const el=$('status'); el.textContent=s; el.className=cls||''; }

/* ---------------- 发送 ---------------- */
function send(cmd, silent){
  if (!rxChar) { log('× 未连接'); return false; }
  try{
    rxChar.writeValueWithoutResponse(enc.encode(cmd + '\r\n'));
    if (!silent) log('> ' + cmd);
    return true;
  }catch(e){ log('× 发送失败 ' + e); return false; }
}

/* ---------------- 连接 ---------------- */
$('btnConnect').onclick = async () => {
  if (!navigator.bluetooth){ alert('这个浏览器不支持 Web Bluetooth，请用 Android Chrome'); return; }
  try{
    setStatus('搜索中…');
    devRef = await navigator.bluetooth.requestDevice({
      filters:[{ services:[SERVICE] }],
      optionalServices:[SERVICE]
    });
    const server = await devRef.gatt.connect();
    const svc = await server.getPrimaryService(SERVICE);
    rxChar = await svc.getCharacteristic(RX_CH);
    txChar = await svc.getCharacteristic(TX_CH);

    await txChar.startNotifications();
    txChar.addEventListener('characteristicvaluechanged', e => {
      const t = new TextDecoder().decode(e.target.value).trim();
      if (!t) return;
      $('lastmsg').textContent = t;
      log('< ' + t);
    });

    devRef.addEventListener('gattserverdisconnected', () => {
      rxChar = null; setStatus('已断开', 'err');
      stopMove(); stopHold();
      log('× 连接断开');
    });

    setStatus('已连接 ' + (devRef.name || ''), 'ok');
    log('已连接，先点「解锁」');
  }catch(e){
    setStatus('连接失败', 'err');
    log('× 连接失败: ' + e);
  }
};

/* ---------------- 行驶 ---------------- */
function sendMove(first){
  if (!moveVec) return;
  const s = parseInt($('spd').value, 10);
  const vx = Math.round(moveVec.vx * s);
  const vy = Math.round(moveVec.vy * s);
  const w  = moveVec.w;
  const cmd = (vx===0 && vy===0 && w===0) ? '$STOP' : `$V:${vx}:${vy}:${w}`;
  send(cmd, !first);
}
function startMove(v){
  moveVec = v; stopMove(true);
  sendMove(true);
  moveTimer = setInterval(() => sendMove(false), 100);
}
function stopMove(keepVec){
  if (moveTimer){ clearInterval(moveTimer); moveTimer = null; }
  if (moveVec){ send('$STOP', true); if(!keepVec) moveVec = null; }
}

document.querySelectorAll('.mv').forEach(btn => {
  const v = {
    vx: parseFloat(btn.dataset.vx || '0'),
    vy: parseFloat(btn.dataset.vy || '0'),
    w : parseInt(btn.dataset.w || '0', 10)
  };
  btn.addEventListener('pointerdown', e => { e.preventDefault(); startMove(v); });
  btn.addEventListener('pointerup',     e => { e.preventDefault(); stopMove(); });
  btn.addEventListener('pointercancel', () => stopMove());
  btn.addEventListener('pointerleave',  () => stopMove());
});
window.addEventListener('pointerup', () => { stopMove(); stopHold(); });
window.addEventListener('blur',      () => { stopMove(); stopHold(); });

/* ---------------- 升降（长按） ---------------- */
function startHold(cmd){
  stopHold(true);
  holdCmd = cmd;
  send('$' + cmd, false);
  holdTimer = setInterval(() => send('$' + cmd, true), 100);   // 100ms 重发，喂看门狗
}
function stopHold(keepCmd){
  if (holdTimer){ clearInterval(holdTimer); holdTimer = null; }
  if (holdCmd){
    send('$LIFT:STOP', true);
    log('> LIFT:STOP');
    if (!keepCmd) holdCmd = null;
  }
}
document.querySelectorAll('.hold').forEach(btn => {
  const cmd = btn.dataset.cmd;
  btn.addEventListener('pointerdown', e => { e.preventDefault(); startHold(cmd); });
  btn.addEventListener('pointerup',     e => { e.preventDefault(); stopHold(); });
  btn.addEventListener('pointercancel', () => stopHold());
  btn.addEventListener('pointerleave',  () => stopHold());
});

/* ---------------- 单点命令（档位 / 翻转） ---------------- */
document.querySelectorAll('[data-tap]').forEach(btn => {
  btn.addEventListener('pointerdown', e => { e.preventDefault(); send('$' + btn.dataset.tap); });
});

/* ---------------- 开关类 ---------------- */
const cameras = { CAM:false, VISION:false };

document.querySelectorAll('.tog').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.tog;
    let on;
    if (key === 'ARM'){
      armed = !armed;
      on = armed;
      send(armed ? '$ARM' : '$DISARM');
      btn.classList.toggle('on', armed);
      btn.textContent = armed ? '已解锁' : '解锁';
      return;
    }
    if (key === 'CAM'){
      cameras.CAM = !cameras.CAM; on = cameras.CAM;
      send('$CAM:' + (on ? '1' : '0'));
    } else {
      cameras.VISION = !cameras.VISION; on = cameras.VISION;
      send('$VISION:' + (on ? '1' : '0'));
    }
    btn.classList.toggle('on', on);
    btn.textContent = btn.dataset.label + (on ? ' 开' : ' 关');
  });
});

/* ---------------- 停止 ---------------- */
$('btnStop').addEventListener('pointerdown', e => { e.preventDefault(); stopMove(); send('$STOP'); });
$('btnStopAll').addEventListener('click', () => {
  stopMove(); stopHold();
  send('$STOP'); send('$LIFT:STOP');
  log('— 全部停止 —');
});

/* ---------------- 速度 / 日志 ---------------- */
$('spd').oninput = e => { $('spdv').textContent = e.target.value; };
$('btnLog').onclick = () => $('log').classList.toggle('show');
</script>
</body>
</html>
